<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080A0E"/>
      <stop offset="0.45" stop-color="#14181E"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163040" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#163040" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <radialGradient id="firepool" cx="34%" cy="78%" r="28%">
      <stop offset="0" stop-color="#E07020" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#C9A03A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#080A0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caveglow" cx="78%" cy="42%" r="32%">
      <stop offset="0" stop-color="#8AD0E2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#163040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A333C"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
    <linearGradient id="warmstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A332C"/>
      <stop offset="1" stop-color="#1A1612"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#void)"/>
  <rect width="1600" height="900" fill="url(#dusk)"/>
  <ellipse cx="1240" cy="380" rx="420" ry="260" fill="url(#caveglow)"/>
  <ellipse cx="540" cy="700" rx="460" ry="240" fill="url(#firepool)"/>

  <!-- distant cave mass -->
  <path fill="#0D1218" d="M0 0 H1600 V220 C1320 160 1180 280 980 210 C760 130 620 250 420 180 C240 120 80 200 0 140 Z"/>
  <path fill="#10161C" d="M0 900 L0 520 C180 480 260 560 420 500 C620 430 780 560 980 490 C1180 420 1360 540 1600 470 V900 Z"/>

  <!-- stalactites -->
  <path fill="#14181E" d="M1180 0 L1210 130 L1240 0 Z"/>
  <path fill="#163040" d="M1320 0 L1344 90 L1370 0 Z"/>
  <path fill="#14181E" d="M1460 20 L1488 150 L1520 20 Z"/>
  <path fill="#0D1218" d="M1088 40 L1110 160 L1138 40 Z"/>

  <!-- fog / unexplored -->
  <ellipse cx="1280" cy="520" rx="380" ry="120" fill="#163040" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="1400" cy="600" rx="300" ry="90" fill="#8AD0E2" opacity="0.06" filter="url(#soft)"/>
  <path fill="#080A0E" opacity="0.55" d="M980 900 C1100 620 1280 580 1600 540 V900 Z"/>

  <!-- hall architecture -->
  <path fill="url(#warmstone)" d="M120 900 V340 C120 300 150 270 210 270 H720 C780 270 810 300 810 340 V900 Z"/><path fill="#E07020" opacity="0.12" d="M210 270 H720 L700 900 H230 Z"/>
  <path fill="#0B0D10" opacity="0.45" d="M210 270 H720 L700 900 H230 Z"/>

  <!-- columns -->
  <rect x="250" y="300" width="36" height="600" fill="#1C2228"/>
  <rect x="248" y="292" width="40" height="18" fill="#C9A03A" opacity="0.55"/>
  <rect x="248" y="760" width="40" height="22" fill="#C9A03A" opacity="0.4"/>
  <rect x="620" y="300" width="36" height="600" fill="#1C2228"/>
  <rect x="618" y="292" width="40" height="18" fill="#C9A03A" opacity="0.55"/>
  <rect x="618" y="760" width="40" height="22" fill="#C9A03A" opacity="0.4"/>

  <!-- arch -->
  <path fill="none" stroke="#E6C05C" stroke-width="4" opacity="0.9" d="M210 340 C210 200 720 200 720 340"/>
  <path fill="none" stroke="#E6C05C" stroke-width="1.2" opacity="0.5" d="M230 350 C230 220 700 220 700 350"/>

  <!-- masonry blocks suggestion -->
  <g stroke="#C9A03A" stroke-opacity="0.12" fill="none">
    <path d="M210 430 H720"/>
    <path d="M210 510 H720"/>
    <path d="M210 590 H720"/>
    <path d="M210 670 H720"/>
    <path d="M330 350 V900"/>
    <path d="M470 350 V900"/>
    <path d="M560 350 V900"/>
  </g>

  <!-- fireplace -->
  <path fill="#14181E" d="M390 900 V640 H540 V900"/>
  <path fill="#E07020" d="M410 900c10-70 30-110 55-110s45 40 55 110H410z"/><ellipse cx="465" cy="820" rx="90" ry="50" fill="#E07020" opacity="0.35"/>
  <path fill="#E6C05C" opacity="0.7" d="M440 900c6-40 16-62 30-62s24 22 30 62H440z"/>
  <rect x="386" y="628" width="158" height="10" fill="#C9A03A" opacity="0.65"/>
  <rect x="400" y="618" width="130" height="8" fill="#2C6670"/>

  <!-- doors / meeting space suggestion -->
  <path fill="#163040" d="M160 900 V700 C160 660 190 640 230 640 H250 V900 Z"/>
  <path fill="none" stroke="#C9A03A" stroke-width="1.5" opacity="0.45" d="M168 700 C168 668 192 650 230 650"/>

  <!-- forge glow right of hearth -->
  <ellipse cx="600" cy="780" rx="70" ry="28" fill="#E07020" opacity="0.25"/>
  <rect x="560" y="760" width="80" height="28" rx="2" fill="#1A1612"/>
  <rect x="560" y="760" width="80" height="6" fill="#C9A03A" opacity="0.4"/>

  <!-- dwarf silhouettes -->
  <g fill="#080A0E">
    <!-- hauler -->
    <path d="M300 800 c2-22 8-34 16-34 6 0 10 8 12 20 l18-6 4 10-22 8 c-1 12-4 22-8 28h-16z"/>
    <!-- smith -->
    <path d="M600 790 c1-24 10-38 20-38 9 0 14 12 16 26 8-2 18 8 10 16-6 4-14 6-18 20h-22z"/>
    <!-- watcher at door -->
    <path d="M200 780 c1-28 8-42 18-42 10 0 16 14 17 34v48h-16c-2-10-8-22-19-40z"/>
    <!-- seated near fire -->
    <path d="M470 820 c0-16 6-26 14-26 7 0 12 8 13 18 10 2 14 10 8 16h-35z"/>
  </g>
  <!-- tiny metal glints on silhouettes -->
  <circle cx="618" cy="770" r="2" fill="#E6C05C" opacity="0.8"/>
  <circle cx="214" cy="760" r="1.6" fill="#8AD0E2" opacity="0.5"/>

  <!-- soot near hall ceiling -->
  <ellipse cx="465" cy="300" rx="180" ry="36" fill="#080A0E" opacity="0.35"/>

  <!-- ladder on a wall -->
  <g stroke="#C9A03A" stroke-opacity="0.35" fill="none">
    <path d="M760 520 V760"/>
    <path d="M784 520 V760"/>
    <path d="M760 548 H784M760 576 H784M760 604 H784M760 632 H784M760 660 H784M760 688 H784M760 716 H784"/>
  </g>

  <!-- cave mouth to the dark -->
  <path fill="#080A0E" d="M810 420 C900 400 980 460 1040 520 C1120 600 1200 680 1600 700 V900 H810 Z" opacity="0.9"/>
  <path fill="none" stroke="#8AD0E2" stroke-opacity="0.18" stroke-width="2" d="M860 500 C980 560 1140 540 1280 480"/>
</svg>
